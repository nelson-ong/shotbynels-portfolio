<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shotbynels — Video Portfolio</title>
<meta name="description" content="Video work by shotbynels — brand films, events, music and personal projects. Melbourne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: quiet editorial index — numbered project list with a cursor-following preview, switchable to a grid */
:root{
  --bg:#f2f2f0;
  --ink:#141414;
  --muted:#8a8a86;
  --line:#d9d9d5;
  --accent:#D97757;
  --sans:"Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.wrap{padding:0 clamp(16px,3.2vw,48px)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase}

/* Header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;gap:16px}
.logo{font-size:clamp(22px,2.2vw,28px);font-weight:600;letter-spacing:-.04em;line-height:1}
.logo i{font-style:normal;color:var(--accent)}
.status{color:var(--muted);display:flex;align-items:center;gap:8px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
nav{display:flex;justify-content:flex-end;gap:24px;grid-column:3}
nav a{color:var(--muted);transition:color .2s}
nav a:hover{color:var(--ink)}
@media (max-width:640px){.status{display:none}header .wrap{grid-template-columns:1fr auto}nav{grid-column:2}}

/* Hero */
.hero{padding:clamp(56px,12vw,150px) 0 clamp(40px,6vw,72px);display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.hero h1{grid-column:1 / span 9;font-size:clamp(34px,5.4vw,80px);line-height:1.02;font-weight:500;letter-spacing:-.045em;text-wrap:balance}
.hero h1 .g{color:var(--muted)}
/* 1. Headline: words slide up out of a mask */
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.hero h1 .wi{display:inline-block}
.js .hero h1 .wi{transform:translateY(110%);transition:transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i) * 28ms)}
.js .hero h1.go .wi{transform:none}
.stat{grid-column:10 / -1;align-self:end;text-align:right;display:grid;gap:6px}
.stat .num{font-size:clamp(64px,9vw,144px);line-height:.85;font-weight:500;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.stat .num em{font-style:normal;color:var(--accent)}
.stat .lbl{color:var(--muted)}
@media (max-width:760px){.stat{grid-column:1 / -1;text-align:left;margin-top:8px}}
.hero .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 40px;color:var(--muted);margin-top:24px}
@media (max-width:760px){.hero h1{grid-column:1 / -1}}

/* Reel — 4. starts inset, opens to full width as you scroll */
.reel-bleed{margin:0 calc(-1 * clamp(16px,3.2vw,48px))}
.reel{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden;clip-path:inset(var(--iy,0px) var(--ix,clamp(16px,3.2vw,48px)) round var(--r,2px));will-change:clip-path}
.reel iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reel-cap{display:flex;justify-content:space-between;padding:12px 0 0;color:var(--muted)}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.reel .yt-cover{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sound{color:var(--muted);display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.sound::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.sound:hover,.sound[aria-pressed="true"]{color:var(--ink)}
.sound[aria-pressed="true"]::before{background:var(--accent);opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}

/* Work */
.work{padding:clamp(80px,10vw,140px) 0 40px}
.work-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.work-bar h2{font-size:clamp(24px,2.6vw,34px);font-weight:500;letter-spacing:-.03em}
.controls{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:center}
.filters,.views{display:flex;flex-wrap:wrap;gap:4px 18px}
.f{color:var(--muted);transition:color .2s;padding:4px 0}
.f sup{font-size:9px;margin-left:2px}
.f:hover,.f[aria-pressed="true"]{color:var(--ink)}
.f[aria-pressed="true"]{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

.list{list-style:none}
.row{display:grid;grid-template-columns:56px 1fr 200px 64px;gap:16px;align-items:baseline;width:100%;text-align:left;padding:22px 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease),padding .35s var(--ease)}
.row .t{font-size:clamp(18px,1.7vw,24px);letter-spacing:-.025em;font-weight:500}
.row .c{color:var(--muted)}
.row .y{text-align:right}
.list:hover .row{color:var(--muted)}
.list .row:hover{color:var(--ink);padding-left:12px}
.list .row:hover .c{color:var(--ink)}
@media (max-width:760px){
  .row{grid-template-columns:40px 1fr auto;row-gap:2px}
  .row .k{display:none}
  .row .y{grid-row:1;grid-column:3}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 20px;padding-top:28px}
.tile{display:grid;gap:10px;text-align:left}
.tile .img{position:relative;aspect-ratio:16/10;background:#e2e2df;overflow:hidden}
.tile .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.15);transition:transform .9s var(--ease),filter .5s}
.tile:hover .img img{transform:scale(1.04);filter:none}
.row .n{font-size:11px;color:var(--muted);margin-left:12px;vertical-align:middle;letter-spacing:.02em}
.badge{position:absolute;left:10px;top:10px;background:rgba(242,242,240,.92);padding:4px 8px;font-size:11px}
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;border-top:1px solid var(--line);padding-top:12px}
.strip button{color:var(--muted);padding:2px 0;transition:color .2s}
.strip button:hover,.strip button[aria-pressed="true"]{color:var(--ink)}
.strip button[aria-pressed="true"] .lb{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.strip button sup{font-size:9px;margin-right:4px}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.tile .cap{display:flex;justify-content:space-between;gap:12px}
.tile .cap b{font-weight:500;letter-spacing:-.015em}
.tile .cap span{color:var(--muted)}
.tile .sub{color:var(--muted);margin-top:-6px}
[hidden]{display:none!important}

/* Cursor preview (index view, desktop only) */
.preview{position:fixed;left:0;top:0;z-index:25;width:340px;aspect-ratio:16/10;pointer-events:none;overflow:hidden;background:#ddd;opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .3s var(--ease),transform .4s var(--ease)}
.preview.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.preview img{width:100%;height:100%;object-fit:cover}
.preview .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (hover:none),(max-width:760px){.preview{display:none}}

/* Clients */
.clients{padding:clamp(80px,10vw,130px) 0 0;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.clients .label{grid-column:1 / span 3;color:var(--muted)}
.clients p{grid-column:4 / -1;font-size:clamp(22px,2.6vw,38px);line-height:1.2;letter-spacing:-.03em;font-weight:500;text-wrap:balance}
.clients p span{color:var(--muted)}
@media (max-width:760px){.clients .label,.clients p{grid-column:1 / -1}}

/* Client carousel */
.clients-sec{padding:clamp(80px,10vw,130px) 0 0}
.clients-head{display:flex;justify-content:space-between;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--line)}
.marquee{margin:0 calc(-1 * clamp(16px,3.2vw,48px));overflow:hidden;padding:18px 0 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;align-items:center;width:max-content;animation:marquee var(--dur,40s) linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.still{position:relative;flex:none;height:clamp(150px,20vw,280px);aspect-ratio:16/9;margin-right:12px;overflow:hidden;background:#e2e2df;padding:0;transition:opacity .4s var(--ease)}
.still img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s var(--ease)}
.still .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.still figcaption{position:absolute;left:10px;bottom:8px;right:10px;color:#fff;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:.35s var(--ease);text-align:left}
.marquee:hover .still{opacity:.45}
.marquee .still:hover{opacity:1}
.still:hover img{transform:scale(1.05)}
.still:hover figcaption{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .marquee{-webkit-mask-image:none;mask-image:none;padding:28px clamp(16px,3.2vw,48px)}
  .marquee{overflow-x:auto}
  .track{animation:none}
  .track .dup{display:none}
}

/* About / contact */
.about{padding:clamp(80px,10vw,130px) 0;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.about .label{grid-column:1 / span 3;color:var(--muted)}
.about .body{grid-column:4 / span 6;display:grid;gap:18px}
.about .body p{font-size:19px;line-height:1.5;max-width:52ch}
.about ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted)}
@media (max-width:760px){.about .label,.about .body{grid-column:1 / -1}}

.contact{border-top:1px solid var(--ink);padding:40px 0 28px}
.big-mail{display:inline-block;font-size:clamp(34px,7vw,104px);line-height:1;letter-spacing:-.05em;font-weight:500;position:relative}
.big-mail::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.big-mail:hover::after{transform:scaleX(1)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);margin-top:56px}
.foot a:hover{color:var(--ink)}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,56px);background:rgba(242,242,240,0);visibility:hidden;transition:background .4s var(--ease),visibility 0s .4s}
.modal.open{visibility:visible;background:rgba(242,242,240,.97);transition:background .4s var(--ease)}
.modal-inner{width:min(1240px,calc(100% - 136px));display:grid;gap:14px;opacity:0;transform:translateY(16px);transition:opacity .4s var(--ease),transform .5s var(--ease)}
.modal.open .modal-inner{opacity:1;transform:none}
.modal-video{position:relative;aspect-ratio:16/9;background:#111;transition:aspect-ratio .5s var(--ease)}
/* Prev / next arrows: beside the video (left/right), or stacked beside a tall video (up/down) */
.vwrap{position:relative}
.mnav[hidden]{display:none}
.arr{position:absolute;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .35s var(--ease)}
.arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.arr:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.arr.prev{left:-72px}.arr.next{right:-72px}
.arr.prev:hover{transform:translateX(-3px)}.arr.next:hover{transform:translateX(3px)}
.count{position:absolute;right:0;top:calc(100% + 14px);color:var(--muted)}
.modal-inner.tall .arr{left:auto;right:-72px}
.modal-inner.tall .arr.prev{margin-top:-56px}
.modal-inner.tall .arr.next{margin-top:8px}
.modal-inner.tall .arr svg{transform:rotate(90deg)}
.modal-inner.tall .arr.prev:hover{transform:translateY(-3px)}.modal-inner.tall .arr.next:hover{transform:translateY(3px)}
.modal-inner.tall .count{top:calc(50% + 68px);right:-72px;width:48px;display:flex;justify-content:center;white-space:nowrap}
@media (max-width:760px){
  .modal-inner{width:100%}
  .arr{width:40px;height:40px;margin-top:-20px;background:rgba(242,242,240,.85);border-color:transparent}
  .arr.prev{left:8px}.arr.next{right:8px}
  .modal-inner.tall .arr{right:8px}
  .modal-inner.tall .arr.prev{margin-top:-46px}.modal-inner.tall .arr.next{margin-top:6px}
  .modal-inner.tall .count{display:none}
}

/* Portrait & square videos: video on the left at full height, details beside it */
.modal-inner.tall{width:auto;max-width:100%;grid-template-columns:auto minmax(240px,360px);grid-template-rows:1fr auto;column-gap:clamp(88px,8vw,120px);align-items:end}
.modal-inner.tall .vwrap{grid-row:1 / span 2}
.modal-inner.tall .modal-video{height:min(84vh,960px);width:auto;aspect-ratio:var(--ar,9/16);max-width:calc(100vw - 560px)}
.modal-inner.tall .strip{grid-column:2;grid-row:1;align-self:end;flex-direction:column;align-items:flex-start;gap:10px;border-top:0;padding-top:0;margin-bottom:16px}
.modal-inner.tall .modal-info{grid-column:2;grid-row:2;flex-direction:column;gap:18px;border-top:1px solid var(--line);padding-top:16px}
.modal-inner.tall .facts{flex-direction:column;gap:14px}
.modal-inner.tall .close{order:-1;align-self:flex-start}
@media (max-width:760px){
  .modal-inner.tall{grid-template-columns:1fr;grid-template-rows:auto;justify-items:center}
  .modal-inner.tall .vwrap{grid-row:auto}
  .modal-inner.tall .modal-video{height:min(68vh,720px);max-width:100%}
  .modal-inner.tall .strip,.modal-inner.tall .modal-info{grid-column:1;grid-row:auto;width:100%;flex-direction:row;flex-wrap:wrap}
  .modal-inner.tall .facts{flex-direction:row}
  .modal-inner.tall .close{order:0}
}
.modal-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-info{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.modal-info h3{font-size:22px;font-weight:500;letter-spacing:-.025em}
.modal-info p{color:var(--muted)}
.modal-info{align-items:flex-start}
.facts{display:flex;flex-wrap:wrap;gap:12px 48px;margin-top:14px}
.facts div{display:grid;gap:3px}
.facts dt{font:400 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts dd{font-size:16px;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
.facts .client dd{font-weight:600}
.modal-info .desc{color:var(--ink);font-size:15px;max-width:60ch;margin-top:8px}
.modal-info .desc:empty{display:none}
.close{color:var(--muted);transition:color .2s;white-space:nowrap}
.close:hover{color:var(--ink)}
.empty-note{position:absolute;inset:0;display:grid;place-items:center;color:#8a8a86;text-align:center;padding:24px}

/* 6. Page-load curtain */
.curtain{display:none}
.js .curtain{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--bg);display:grid;grid-template-rows:auto 1fr auto auto;padding:clamp(16px,3.2vw,48px);transition:transform 1.05s cubic-bezier(.77,0,.18,1)}
.curtain .c-top{display:flex;justify-content:space-between;color:#8a8a86;opacity:0;animation:cFade .6s ease .2s forwards}
.curtain .c-mid{display:flex;align-items:center}
.curtain .cl{overflow:hidden;padding:.06em 0 .22em;margin-bottom:-.16em}
.curtain .cl span{display:inline-block;font-size:clamp(64px,15vw,260px);font-weight:500;letter-spacing:-.065em;line-height:.9;transform:translateY(105%);animation:cUp 1.1s cubic-bezier(.16,1,.3,1) .1s forwards}
.curtain .cl i{font-style:normal;color:var(--accent)}
.curtain .c-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:18px}
.curtain .c-loc{display:grid;gap:10px;opacity:0;transform:translateY(14px);animation:cIn .9s cubic-bezier(.16,1,.3,1) .35s forwards}
.curtain .c-city{font-size:clamp(26px,3.6vw,56px);font-weight:500;letter-spacing:-.04em;line-height:1}
.curtain .c-coords{color:#8a8a86}
.curtain .c-pct{font-size:clamp(48px,7vw,112px);font-weight:500;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums;opacity:0;animation:cFade .6s ease .3s forwards}
.curtain .c-pct small{font-size:.32em;letter-spacing:0;margin-left:4px;color:#8a8a86;vertical-align:top}
.curtain .c-bar{height:1px;background:rgba(242,242,240,.15)}
.curtain .c-bar span{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.curtain.up .cl span{transform:translateY(-30%);transition:transform 1.05s cubic-bezier(.77,0,.18,1)}
@keyframes cUp{to{transform:none}}
@keyframes cFade{to{opacity:1}}
@media (max-width:640px){.curtain .c-bot{flex-direction:column;align-items:flex-start}}
.curtain.up{transform:translateY(-100%)}
.curtain-done .curtain{display:none!important}
@keyframes cIn{to{opacity:1;transform:none}}

/* 3. Custom cursor */
.cursor{display:none}
@media (hover:hover) and (pointer:fine){
  html.has-cursor body, html.has-cursor a, html.has-cursor button{cursor:none}
  .has-cursor .cursor{display:grid;place-items:center;position:fixed;left:0;top:0;z-index:95;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);transition:width .4s cubic-bezier(.16,1,.3,1),height .4s cubic-bezier(.16,1,.3,1),background .3s,border-color .3s,opacity .25s;border:1px solid transparent}
  .cursor span{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .2s}
  .cursor.play{width:86px;height:86px}
  .cursor.play span{opacity:1;transition-delay:.1s}
  .cursor.link{width:34px;height:34px;background:transparent;border-color:var(--ink)}
  .cursor.off{opacity:0}
}

/* 7. Smooth scroll (Lenis) */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

/* Load-in — content is visible if JS fails */
.js .rise{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.js .rise.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important}
  .js .rise{opacity:1;transform:none}
  .js .hero h1 .wi{transform:none}
  .js .curtain{display:none}
}
</style>
<script>document.documentElement.classList.add("js");setTimeout(()=>document.documentElement.classList.add("curtain-done"),5000)</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>

<body>
<div class="curtain" id="curtain" aria-hidden="true">
  <div class="c-top mono"><span>Video portfolio</span><span id="cClock"></span></div>
  <div class="c-mid"><div class="cl"><span>shotbynels<i>.</i></span></div></div>
  <div class="c-bot">
    <div class="c-loc">
      <div class="c-city" id="curtainLoc">Melbourne, Australia</div>
      <div class="c-coords mono" id="cCoords">37.8136° S &nbsp; 144.9631° E</div>
    </div>
    <div class="c-pct"><span id="cPct">000</span><small>%</small></div>
  </div>
  <div class="c-bar"><span id="cBar"></span></div>
</div>
<script>
// Loading counter + Melbourne clock (runs before the rest of the page)
(function(){
  var pct = document.getElementById("cPct"), bar = document.getElementById("cBar"), clock = document.getElementById("cClock");
  try { clock.textContent = new Intl.DateTimeFormat("en-AU", {hour:"numeric", minute:"2-digit", timeZone:"Australia/Melbourne", timeZoneName:"short"}).format(new Date()); } catch(e) {}
  var t0 = performance.now(), val = 0, finishing = null;
  function draw(v){ val = v; pct.textContent = String(Math.round(v)).padStart(3, "0"); bar.style.transform = "scaleX(" + (v / 100) + ")"; }
  function tick(t){
    if(finishing) return;
    var k = Math.min(1, (t - t0) / 1600);
    draw(92 * (1 - Math.pow(1 - k, 3)));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  window.__curtainFinish = function(cb){
    var from = val, s = performance.now();
    finishing = true;
    (function end(t){
      var k = Math.min(1, (t - s) / 320);
      draw(from + (100 - from) * k);
      if(k < 1) requestAnimationFrame(end); else setTimeout(cb, 120);
    })(s);
  };
})();
</script>

<!--

  6. Too many projects? Add `hidden: true` to keep one in the file but off the page.
  7. More than one video for a project? Use `videos` instead of `link`:
       videos: [

         { label: "Instagram cut",  link: "https://drive.google.com/…" },

<script>

// ---- Google Sheet loader ----
const isPersonalClient = c => /^\s*(personal|personal (project|work)|self|own)\s*$/i.test(c || "");
function parseCSV(t){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
async function loadSheet(){
  const id = (SHEET_URL.match(/\/d\/([\w-]{20,})/) || [])[1];
  if(!id) return;
  const get = name => fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`)
    .then(r => { if(!r.ok) throw new Error(name + " " + r.status); return r.text(); });
  const [projCsv, setCsv, cliCsv, stCsv] = await Promise.all([get("Projects"), get("Settings").catch(() => ""), get("Clients").catch(() => ""), get("Stills").catch(() => "")]);
  const sRows = parseCSV(stCsv);
  if(sRows.length > 1){
    const sh = sRows.shift().map(h => h.trim().toLowerCase());
    const si = n => sh.indexOf(n);
    if(si("image") > -1){
      const list = sRows.map(r => ({ image: (r[si("image")] ?? "").trim(), caption: (r[si("caption")] ?? "").trim(), project: (r[si("project")] ?? "").trim() }))
                        .filter(x => x.image);
      if(list.length) SITE.stills = list;
    }
  }
  const cRows = parseCSV(cliCsv);
  if(cRows.length > 1){
    const ch = cRows.shift().map(h => h.trim().toLowerCase());
    const ci = n => ch.indexOf(n);
    const list = cRows.map(r => ({ name: (r[ci("name")] ?? "").trim(), logo: (r[ci("logo")] ?? "").trim() }))
                      .filter(c => c.name || c.logo);
    if(list.length && ci("name") > -1) SITE.clients = list;
  }

  const rows = parseCSV(projCsv);
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const col = (r, name) => (r[head.indexOf(name)] ?? "").trim();
  const yes = v => /^(yes|y|true|x|hide|hidden)$/i.test(v);
  // Each row can carry one video ("Video"/"Label") or several ("Video 1", "Label 1", "Client 1"…).
  // Rows with the same Title are merged into one project, so each video can have its own client.
  const rowProjects = rows.map(r => {
    // Hidden: "yes" hides this row's video only; "all" (on the title row) hides the whole project
    const h = col(r, "hidden");
    const base = { client: col(r, "client"), featuring: col(r, "featuring"), role: col(r, "role"), year: col(r, "year"), desc: col(r, "description"), format: col(r, "format"), hidden: yes(h) };
    const videos = [];
    const single = col(r, "video");
    if(single) videos.push({ ...base, label: col(r, "label"), link: single });
    for(let n = 1; n <= 10; n++){
      const link = col(r, `video ${n}`);
      if(link) videos.push({ ...base, label: col(r, `label ${n}`), link,
        client: col(r, `client ${n}`) || base.client, featuring: col(r, `featuring ${n}`) || base.featuring, role: col(r, `role ${n}`) || base.role, format: col(r, `format ${n}`) || base.format });
    }
    return {
      title: col(r, "title"), category: col(r, "category") || "Other", hideAll: /^(all|project|whole project)$/i.test(h),
      thumb: col(r, "thumbnail") || undefined, ...base, videos
    };
  });
  const merged = [];
  rowProjects.forEach(p => {
    // A row with no Title adds its video(s) to the project above it
    if(!p.title){
      const last = merged[merged.length - 1];
      if(last && p.videos.length) last.videos.push(...p.videos);
      return;
    }
    const key = p.title.toLowerCase();
    const found = merged.find(m => m.title.toLowerCase() === key);
    if(!found){ merged.push(p); return; }
    found.videos.push(...p.videos);
  });
  // label any unnamed videos: real client name, then who's featured, then "Film 02"
  merged.forEach(p => {
    p.videos = p.videos.filter(v => !v.hidden);   // drop hidden videos
    p.hidden = !!p.hideAll;
    const auto = new Set();
    p.videos.forEach((v, n) => {
      const realClient = isPersonalClient(v.client) ? "" : v.client;
      if(!v.label){ v.label = p.videos.length > 1 ? (realClient || v.featuring || "") : p.title; auto.add(v); }
    });
    // auto names that repeat (e.g. same client twice) or are empty become "Film 01", "Film 02"…
    const counts = {};
    p.videos.forEach(v => { if(auto.has(v)) counts[v.label] = (counts[v.label] || 0) + 1; });
    p.videos.forEach((v, n) => {
      if(auto.has(v) && (!v.label || counts[v.label] > 1)) v.label = `Film ${String(n+1).padStart(2, "0")}`;
    });
    // projects with no video links yet stay off the site until you add one
    if(!p.videos.some(v => v.link)) p.hidden = true;
  });
  if(merged.length) PROJECTS = merged;

  const keys = { "email":"email", "instagram":"instagram", "location":"location", "showreel":"showreel",
                 "showreel label":"showreelLabel", "status":"available", "name":"name",
                 "headline":"headline", "headline (grey)":"headlineGrey", "tagline":"tagline",
                 "about":"about", "services":"services", "contact heading":"contactHeading", "project count":"projectCount" };
  parseCSV(setCsv).slice(1).forEach(([k, v = ""]) => {
    const key = keys[(k || "").trim().toLowerCase()];
    if(key) SITE[key] = v.trim().replace(/^@/, "");
  });
}

function boot(){
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");

// ---- Links: Drive, Vimeo, YouTube ----
function driveId(link){
  if(!link) return "";
  const m = link.match(/\/d\/([\w-]{20,})/) || link.match(/[?&]id=([\w-]{20,})/);
  if(m) return m[1];
  return /^[\w-]{20,}$/.test(link.trim()) ? link.trim() : "";
}
function embedSrc(link, autoplay=true){
  const v = link && link.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(v) return `https://player.vimeo.com/video/${v[1]}${autoplay?"?autoplay=1":""}`;
  const y = link && link.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  if(y) return `https://www.youtube.com/embed/${y[1]}?rel=0${autoplay?"&autoplay=1":""}`;
  const id = driveId(link);
  return id ? `https://drive.google.com/file/d/${id}/preview` : "";
}
// A project's videos: either `videos: [...]` or a single `link`
function vids(p){
  if(Array.isArray(p.videos) && p.videos.length)
    return p.videos.map((v,n) => ({ ...v, label: v.label || `Part ${n+1}`, link: v.link || "" }));
  return [{label: p.title, link: p.link || ""}];
}
function thumbSrc(p){
  if(p.thumb) return p.thumb;
  const id = driveId(vids(p)[0].link);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1280` : "";
}

const shown = PROJECTS.map((p,i) => ({...p, i})).filter(p => !p.hidden);

// ---- Page text (from Settings) ----
const h1 = document.getElementById("headline");
{
  let n = 0;
  const words = (txt, cls) => String(txt || "").split(/\s+/).filter(Boolean)
    .map(w => `<span class="w"><span class="wi ${cls}" style="--i:${n++}">${esc(w)}</span></span>`).join(" ");
  h1.innerHTML = words(SITE.headline, "") + (SITE.headlineGrey ? " " + words(SITE.headlineGrey, "g") : "");
  h1.setAttribute("aria-label", [SITE.headline, SITE.headlineGrey].filter(Boolean).join(" "));
}
document.getElementById("tagline").textContent = SITE.tagline || "";
document.getElementById("aboutText").innerHTML = String(SITE.about || "").split(/\n\s*\n|\n/).filter(x => x.trim())
  .map(x => `<p>${esc(x.trim())}</p>`).join("");
document.getElementById("services").innerHTML = String(SITE.services || "").split(",").map(x => x.trim()).filter(Boolean)
  .map(x => `<li>${esc(x)}</li>`).join("");
document.getElementById("contactHeading").textContent = SITE.contactHeading || "Start a project";

// ---- Header + hero bits ----
document.getElementById("status").textContent = SITE.available || "";
if(!SITE.available) document.getElementById("status").remove();
// 5. Project counter (Settings → Project count, e.g. "40+", or the number of projects shown)
const countEl = document.getElementById("count");
const cm = String(SITE.projectCount || "").match(/^(\d+)(.*)$/);
const countTarget = cm ? +cm[1] : shown.length, countSuffix = cm ? cm[2] : "";
const fmtCount = v => `${cm ? v : pad(v)}${countSuffix ? `<em>${esc(countSuffix)}</em>` : ""}`;
countEl.innerHTML = fmtCount(reduceMotion ? countTarget : 0);
function runCounter(){
  if(reduceMotion) return;
  const t0 = performance.now(), dur = 1400;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    countEl.innerHTML = fmtCount(Math.round(countTarget * e));
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}
document.getElementById("loc").textContent = SITE.location;
document.getElementById("reelLabel").textContent = SITE.showreelLabel;

// ---- Reel: autoplays muted on loop (MP4 file, YouTube or Vimeo). Drive links can't autoplay. ----
const reelBox = document.getElementById("reel"), soundBtn = document.getElementById("reelSound");
let reel = { type: "none" };
(function(){
  const link = String(SITE.showreel || "").trim();
  const yt = link.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([\w-]{11})/);
  const vm = link.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  const title = esc(SITE.showreelLabel);
  if(!link){
    reelBox.innerHTML = `<div class="empty-note mono"><span>Add your showreel link in the sheet (Settings → Showreel)</span></div>`;
  } else if(/\.(mp4|webm|mov)(\?|#|$)/i.test(link)){
    reelBox.innerHTML = `<video src="${esc(link)}" autoplay muted loop playsinline preload="auto" aria-label="${title}"></video>`;
    reel = { type: "file", el: reelBox.querySelector("video") };
  } else if(yt){
    const id = yt[1];
    reelBox.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1" allow="autoplay; fullscreen" title="${title}"></iframe>`;
    reel = { type: "yt", el: reelBox.querySelector("iframe") };
  } else if(vm){
    reelBox.innerHTML = `<iframe src="https://player.vimeo.com/video/${vm[1]}?autoplay=1&muted=1&loop=1&autopause=0&playsinline=1&title=0&byline=0&portrait=0" allow="autoplay; fullscreen" title="${title}"></iframe>`;
    reel = { type: "vimeo", el: reelBox.querySelector("iframe") };
  } else {
    const src = embedSrc(link, false);
    reelBox.innerHTML = src
      ? `<iframe src="${src}" allow="autoplay; fullscreen" title="${title}"></iframe>`
      : `<div class="empty-note mono"><span>Showreel link not recognised</span></div>`;
    reel = { type: "drive" };
  }
  if(["file","yt","vimeo"].includes(reel.type)) soundBtn.hidden = false;
})();
function reelCmd(cmd){
  if(reel.type === "file"){
    const v = reel.el;
    if(cmd === "mute") v.muted = true;
    if(cmd === "unmute"){ v.muted = false; v.play().catch(() => {}); }
    if(cmd === "pause") v.pause();
    if(cmd === "play") v.play().catch(() => {});
  } else if(reel.type === "yt"){
    const map = { mute: "mute", unmute: "unMute", pause: "pauseVideo", play: "playVideo" };
    reel.el.contentWindow.postMessage(JSON.stringify({ event: "command", func: map[cmd], args: [] }), "*");
  } else if(reel.type === "vimeo"){
    const msg = cmd === "mute" ? { method: "setVolume", value: 0 } : cmd === "unmute" ? { method: "setVolume", value: 1 }
              : cmd === "pause" ? { method: "pause" } : { method: "play" };
    reel.el.contentWindow.postMessage(JSON.stringify(msg), "*");
  }
}
soundBtn.addEventListener("click", () => {
  const on = soundBtn.getAttribute("aria-pressed") !== "true";
  reelCmd(on ? "unmute" : "mute");
  soundBtn.setAttribute("aria-pressed", on);
  soundBtn.textContent = on ? "Sound on" : "Sound off";
});

// ---- Filters ----
const cats = ["All", ...new Set(shown.map(p => p.category))];
const countFor = c => c === "All" ? shown.length : shown.filter(p => p.category === c).length;
let active = "All";
const filters = document.getElementById("filters");
filters.innerHTML = cats.map(c =>
  `<button class="f" type="button" data-cat="${esc(c)}" aria-pressed="${c==="All"}">${esc(c)}<sup>${countFor(c)}</sup></button>`).join("");
filters.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if(!b) return;
  active = b.dataset.cat;
  filters.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

// ---- Views ----
let view = "list";
document.querySelector(".views").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if(!b) return;
  view = b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

// ---- Render list + grid ----
let currentItems = [];
const list = document.getElementById("list"), grid = document.getElementById("grid");
function render(){
  const items = shown.filter(p => active === "All" || p.category === active);
  currentItems = items;
  list.hidden = view !== "list"; grid.hidden = view !== "grid";
  list.innerHTML = items.map((p,n) => `
    <li><button class="row" type="button" data-i="${p.i}" aria-label="Play ${esc(p.title)}">
      <span class="mono">${pad(n+1)}</span>
      <span class="t">${esc(p.title)}${vids(p).length > 1 ? `<span class="n mono">${vids(p).length} films</span>` : ""}</span>
      <span class="k mono">${esc(p.category)}</span>
      <span class="y mono">${esc(p.year ?? "")}</span>
    </button></li>`).join("");
  grid.innerHTML = items.map(p => {
    const t = thumbSrc(p);
    return `<button class="tile" type="button" data-i="${p.i}" aria-label="Play ${esc(p.title)}">
      <div class="img">${t ? `<img src="${t}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<div class="ph mono">No thumbnail</div>`}${vids(p).length > 1 ? `<span class="badge mono">${vids(p).length} films</span>` : ""}</div>
      <div class="cap"><b>${esc(p.title)}</b><span class="mono">${esc(p.year ?? "")}</span></div>
      <div class="sub">${esc(p.role)}</div>
    </button>`;
  }).join("");
  if(!reduceMotion){
    [...list.children, ...grid.children].forEach((el,n) => {
      el.animate([{opacity:0, transform:"translateY(10px)"},{opacity:1, transform:"none"}],
        {duration:600, delay:Math.min(n,12)*40, easing:"cubic-bezier(.2,.7,.2,1)", fill:"backwards"});
    });
  }
}
render();

// ---- Stills carousel: Stills tab in the Sheet, or frames from your project videos ----
(function(){
  const imgSrc = l => { const id = driveId(l); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : l; };
  let items;
  if(Array.isArray(SITE.stills) && SITE.stills.length){
    items = SITE.stills.map(x => {
      const p = x.project ? PROJECTS.findIndex(q => q.title.toLowerCase() === x.project.toLowerCase()) : -1;
      return { src: imgSrc(x.image), caption: x.caption || (p > -1 ? PROJECTS[p].title : ""), i: p };
    });
  } else {
    items = [];
    shown.forEach(p => {
      if(p.thumb) items.push({ src: p.thumb, caption: p.title, i: p.i });
      vids(p).forEach(v => { const id = driveId(v.link); if(id) items.push({ src: imgSrc(id), caption: v.label || p.title, i: p.i }); });
    });
    // drop exact duplicates
    items = items.filter((x, k) => items.findIndex(y => y.src === x.src) === k);
  }
  const sec = document.getElementById("clientsSec");
  if(!items.length){ sec.remove(); return; }
  document.getElementById("clientCount").textContent = pad(items.length);
  const one = items.map(x => {
    const inner = `<img src="${esc(x.src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">${x.caption ? `<figcaption>${esc(x.caption)}</figcaption>` : ""}`;
    return x.i > -1
      ? `<button type="button" class="still" data-i="${x.i}" aria-label="Play ${esc(x.caption)}">${inner}</button>`
      : `<figure class="still">${inner}</figure>`;
  }).join("");
  const track = document.getElementById("track");
  track.innerHTML = `<div style="display:flex" class="grp">${one}</div>`;
  const grp = track.firstElementChild;
  let guard = 0;
  while(grp.scrollWidth < innerWidth * 1.2 && guard++ < 20) grp.insertAdjacentHTML("beforeend", one);
  track.insertAdjacentHTML("beforeend", `<div style="display:flex" class="grp dup" aria-hidden="true">${grp.innerHTML.replace(/<button /g, '<button tabindex="-1" ')}</div>`);
  const setDur = () => track.style.setProperty("--dur", Math.max(20, grp.scrollWidth / 45) + "s");
  setDur(); addEventListener("load", setDur);
  sec.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if(b) openProject(+b.dataset.i, b); });
})();

// ---- Cursor-follow preview in list view ----
const preview = document.getElementById("preview");
let tx = 0, ty = 0, cx = 0, cy = 0, raf = null, current = -1;
function loop(){
  cx += (tx - cx) * (reduceMotion ? 1 : .14);
  cy += (ty - cy) * (reduceMotion ? 1 : .14);
  preview.style.left = cx + "px"; preview.style.top = cy + "px";
  raf = Math.abs(tx-cx) + Math.abs(ty-cy) > .3 ? requestAnimationFrame(loop) : null;
}
list.addEventListener("mousemove", e => {
  tx = e.clientX + 200; ty = e.clientY;
  if(tx + 180 > innerWidth) tx = e.clientX - 200;
  if(!raf) raf = requestAnimationFrame(loop);
  const r = e.target.closest(".row");
  if(r && +r.dataset.i !== current){
    current = +r.dataset.i;
    const t = thumbSrc(PROJECTS[current]);
    preview.innerHTML = t ? `<img src="${t}" alt="" referrerpolicy="no-referrer">` : `<div class="ph mono">${esc(PROJECTS[current].title)}</div>`;
  }
  preview.classList.toggle("on", !!r);
});
list.addEventListener("mouseenter", e => { cx = tx = e.clientX + 200; cy = ty = e.clientY; });
list.addEventListener("mouseleave", () => { preview.classList.remove("on"); current = -1; });

// ---- Modal ----
const modal = document.getElementById("modal"), mVideo = document.getElementById("mVideo");
let lastFocus = null;
const mStrip = document.getElementById("mStrip");
let openVids = [];
// ---- Video shape: from the sheet's Format column, otherwise measured from the Drive thumbnail ----
const shapeCache = {};
function formatRatio(f){
  f = String(f || "").trim().toLowerCase();
  if(!f) return 0;
  if(/portrait|vertical|reel|story|tiktok|9[:x/]16/.test(f)) return 9/16;
  if(/4[:x/]5/.test(f)) return 4/5;
  if(/square|1[:x/]1/.test(f)) return 1;
  if(/landscape|horizontal|wide|16[:x/]9/.test(f)) return 16/9;
  const m = f.match(/^(\d+(?:\.\d+)?)\s*[:x/]\s*(\d+(?:\.\d+)?)$/);
  return m ? (+m[1] / +m[2]) : 0;
}
function videoRatio(v){
  const fixed = formatRatio(v.format);
  if(fixed) return Promise.resolve(fixed);
  const id = driveId(v.link);
  if(!id) return Promise.resolve(16/9);
  if(shapeCache[id]) return Promise.resolve(shapeCache[id]);
  return new Promise(res => {
    const img = new Image();
    img.referrerPolicy = "no-referrer";
    const done = r => { shapeCache[id] = r; res(r); };
    img.onload = () => done(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 16/9);
    img.onerror = () => res(16/9);
    setTimeout(() => res(shapeCache[id] || 16/9), 2500);
    img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w400`;
  });
}
let shapeToken = 0;
function applyShape(v){
  const inner = document.querySelector(".modal-inner"), tok = ++shapeToken;
  videoRatio(v).then(r => {
    if(tok !== shapeToken) return;
    const tall = r < 1.2;   // portrait, 4:5 and square get the side-by-side layout
    inner.classList.toggle("tall", tall);
    inner.style.setProperty("--ar", tall ? String(r) : "");
  });
}

let curProj = -1, curVid = 0;
function playlist(){
  const list = [];
  // arrows stay inside the open project's category (e.g. Brand → only Brand videos)
  const cat = curProj > -1 ? PROJECTS[curProj].category : null;
  shown.filter(p => !cat || p.category === cat).forEach(p => vids(p).forEach((v, n) => list.push([p.i, n])));
  return list;
}
function step(dir){
  const list = playlist(); if(list.length < 2) return;
  let pos = list.findIndex(([i, n]) => i === curProj && n === curVid);
  const [i, n] = list[(pos + dir + list.length) % list.length];
  if(i === curProj) playVid(n);
  else openProject(i, lastFocus, n);
}
function updateNav(){
  const list = playlist(), nav = document.getElementById("mNav");
  nav.hidden = list.length < 2;
  const pos = list.findIndex(([i, n]) => i === curProj && n === curVid);
  document.getElementById("mCount").textContent = `${pad(pos + 1)} / ${pad(list.length)}`;
}
function playVid(n){
  curVid = n;
  const v = openVids[n], src = embedSrc(v.link);
  mVideo.innerHTML = src
    ? `<iframe src="${src}" allow="autoplay; fullscreen" allowfullscreen title="${esc(v.label)}"></iframe>`
    : `<div class="empty-note mono">No video linked yet for “${esc(v.label)}”</div>`;
  if(!reduceMotion) mVideo.animate([{opacity:0},{opacity:1}], {duration:400, easing:"ease-out"});
  mStrip.querySelectorAll("button").forEach((b,k) => b.setAttribute("aria-pressed", k === n));
  applyShape(v);
  showFacts(v);
  updateNav();
}
let openProj = null;
function showFacts(v){
  const p = openProj || {};
  const pick = k => (v && v[k] !== undefined && String(v[k]).trim() !== "") ? v[k] : p[k];
  const el = document.getElementById("mFacts");
  const personal = isPersonalClient(pick("client")) || /^personal$/i.test(p.category || "");
  const rows = personal
    ? [["Type", "Personal work", "client"], ["Featuring", pick("featuring"), ""], ["Role", pick("role"), ""], ["Year", pick("year"), ""]]
    : [["Client", pick("client"), "client"], ["Featuring", pick("featuring"), ""], ["Role", pick("role"), ""], ["Year", pick("year"), ""]];
  el.innerHTML = rows
    .filter(([, x]) => x !== undefined && String(x).trim() !== "")
    .map(([k, x, c]) => `<div class="${c}"><dt>${k}</dt><dd>${esc(x)}</dd></div>`).join("");
  document.getElementById("mDesc").textContent = pick("desc") || "";
  if(!reduceMotion) el.animate([{opacity:0, transform:"translateY(4px)"},{opacity:1, transform:"none"}], {duration:350, easing:"ease-out"});
}
mStrip.addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if(b && b.getAttribute("aria-pressed") !== "true") playVid(+b.dataset.v);
});
function openProject(i, from, startVid = 0){
  const wasOpen = modal.classList.contains("open");
  const p = PROJECTS[i];
  curProj = i;
  lastFocus = from;
  openProj = p;
  openVids = vids(p);
  mStrip.hidden = openVids.length < 2;
  mStrip.innerHTML = openVids.map((v,n) =>
    `<button type="button" data-v="${n}" aria-pressed="false"><sup>${pad(n+1)}</sup><span class="lb">${esc(v.label)}</span></button>`).join("");
  playVid(startVid);
  document.getElementById("mTitle").textContent = p.title;
  if(!reduceMotion && modal.classList.contains("open"))
    document.querySelector(".modal-info").animate([{opacity:0, transform:"translateY(6px)"},{opacity:1, transform:"none"}], {duration:400, easing:"ease-out"});

  preview.classList.remove("on");
  modal.classList.add("open");
  reelCmd("pause");
  window.__lenis && window.__lenis.stop();
  document.body.style.overflow = "hidden";
  if(!wasOpen) document.getElementById("mClose").focus({preventScroll:true});
}
document.getElementById("work").addEventListener("click", e => {
  const b = e.target.closest("[data-i]"); if(b) openProject(+b.dataset.i, b);
});
function closeModal(){
  modal.classList.remove("open");
  reelCmd("play");
  window.__lenis && window.__lenis.start();
  document.body.style.overflow = "";
  setTimeout(() => { if(!modal.classList.contains("open")) mVideo.innerHTML = ""; }, 400);
  lastFocus && lastFocus.focus();
}
document.getElementById("mClose").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if(!modal.classList.contains("open")) return;
  if(e.key === "Escape") closeModal();
  else if(e.key === "ArrowRight" || e.key === "ArrowDown"){ e.preventDefault(); step(1); }
  else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){ e.preventDefault(); step(-1); }
});
document.getElementById("mPrev").addEventListener("click", () => step(-1));
document.getElementById("mNext").addEventListener("click", () => step(1));

// ---- Contact ----
const mail = document.getElementById("mail");
mail.textContent = SITE.email;
mail.href = `mailto:${SITE.email}?subject=${encodeURIComponent("Video project enquiry")}`;
document.getElementById("copy").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
SITE.instagram = String(SITE.instagram || "").replace(/^@/, "");
if(SITE.instagram) document.getElementById("ig").innerHTML = `<a href="https://instagram.com/${esc(SITE.instagram)}" target="_blank" rel="noopener">Instagram ↗</a>`;

// ---- 4. Showreel opens up as you scroll ----
const reelEl = document.getElementById("reel");
function reelScroll(){
  const g = parseFloat(getComputedStyle(document.querySelector("main")).paddingLeft) || 16;
  if(reduceMotion){ reelEl.style.setProperty("--ix", g + "px"); return; }
  const r = reelEl.getBoundingClientRect(), vh = innerHeight;
  const t = Math.min(1, Math.max(0, 1 - (r.top - vh * .08) / (vh * .7)));
  const ix = (1 - t) * (g + innerWidth * .05);
  reelEl.style.setProperty("--ix", ix.toFixed(1) + "px");
  reelEl.style.setProperty("--iy", (ix * 9 / 16).toFixed(1) + "px");
  reelEl.style.setProperty("--r", ((1 - t) * 14).toFixed(1) + "px");
}
let reelTick = false;
addEventListener("scroll", () => { if(!reelTick){ reelTick = true; requestAnimationFrame(() => { reelScroll(); reelTick = false; }); } }, {passive:true});
addEventListener("resize", reelScroll);
reelScroll();

// ---- 7. Smooth scrolling ----
if(window.Lenis && !reduceMotion){
  const lenis = new Lenis({ lerp: .09, wheelMultiplier: 1 });
  window.__lenis = lenis;
  (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]'); if(!a) return;
    const id = a.getAttribute("href");
    const el = id === "#top" ? 0 : document.querySelector(id);
    if(el === null) return;
    e.preventDefault();
    lenis.scrollTo(el, { offset: -60, duration: 1.4 });
  });
}

// ---- 3. Custom cursor ----
if(matchMedia("(hover:hover) and (pointer:fine)").matches && !reduceMotion){
  document.documentElement.classList.add("has-cursor");
  const cur = document.getElementById("cursor");
  let mx = -100, my = -100, px = -100, py = -100;
  addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; }, {passive:true});
  (function follow(){
    px += (mx - px) * .22; py += (my - py) * .22;
    cur.style.left = px + "px"; cur.style.top = py + "px";
    requestAnimationFrame(follow);
  })();
  document.addEventListener("mouseover", e => {
    const t = e.target;
    const overVideo = t.tagName === "IFRAME" || t.closest(".reel, .modal-video");
    cur.classList.toggle("off", !!overVideo);
    cur.classList.toggle("play", !overVideo && !!t.closest("[data-i]"));
    cur.classList.toggle("link", !overVideo && !t.closest("[data-i]") && !!t.closest("a, button"));
  });
  document.addEventListener("mouseleave", () => cur.classList.add("off"));
  document.addEventListener("mouseenter", () => cur.classList.remove("off"));
}

// ---- 6. Curtain → 1. headline → reveals + 5. counter ----
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}), {threshold:.1}) : null;
function startPage(){
  h1.classList.add("go");
  document.querySelectorAll(".rise").forEach(el => io ? io.observe(el) : el.classList.add("in"));
  setTimeout(runCounter, 400);
}
const curtain = document.getElementById("curtain");
document.getElementById("curtainLoc").textContent = SITE.location || "";
if(!/melbourne/i.test(SITE.location || "")) document.getElementById("cCoords").remove();
if(reduceMotion || !curtain || document.documentElement.classList.contains("curtain-done")){
  curtain && curtain.remove(); startPage();
} else {
  const wait = Math.max(0, 1500 - performance.now());
  const lift = () => {
    curtain.classList.add("up");
    setTimeout(startPage, 380);
    setTimeout(() => curtain.remove(), 1200);
  };
  setTimeout(() => window.__curtainFinish ? window.__curtainFinish(lift) : lift(), wait);
}

}
loadSheet().catch(e => console.warn("Sheet not loaded, using backup data:", e)).finally(boot);
</script>
